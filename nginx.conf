server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Proxy to backend services
    location /api/earnings/actuator/ {
        proxy_pass http://pead-earnings:8081/actuator/;
        proxy_set_header Host $host;
    }

    location /api/earnings/ {
        proxy_pass http://pead-earnings:8081/api/v1/earnings/;
        proxy_set_header Host $host;
    }

    location /api/market/actuator/ {
        proxy_pass http://pead-market:8082/actuator/;
        proxy_set_header Host $host;
    }

    location /api/market/ {
        proxy_pass http://pead-market:8082/api/v1/market/;
        proxy_set_header Host $host;
    }

    location /api/scanner/ {
        proxy_pass http://pead-scanner:8083/api/v1/scanner/;
        proxy_set_header Host $host;
    }

    location /api/signals/ {
        proxy_pass http://pead-signals:8084/api/v1/signals/;
        proxy_set_header Host $host;
    }

    # SPA fallback — all non-API routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
